services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - .stack-data/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
